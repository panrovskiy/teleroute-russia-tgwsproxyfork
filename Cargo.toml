[package]
name = "tele-route"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Windows Telegram transport router with local SOCKS5, WSS and UDP/TUN call path"

[dependencies]
anyhow = "1"
aes = "0.8"
bytes = "1"
ctr = "0.9"
directories-next = "2"
ipnet = "2"
eframe = { version = "0.36.2", default-features = false, features = ["glow"] }
egui = "0.36.2"
futures-util = "0.3"
parking_lot = "0.12"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = "0.23"
webpki-roots = "1"
rand = "0.9"
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tray-icon = "0.26"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies]
wintun-bindings = { version = "0.7.40", features = ["async", "verify_binary_signature"] }
winreg = "0.56"

[dev-dependencies]

[[bin]]
name = "tele-route"
path = "src/main.rs"

[[bin]]
name = "call-relay"
path = "src/bin/call-relay.rs"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"
